name: release

# Publishes to PyPI when a v* tag is pushed, using PyPI Trusted Publishing
# (OIDC). No API token is stored anywhere. Configure the trusted publisher on
# PyPI once before the first tag: project idemkit, owner idemkit, repository
# idemkit, workflow release.yml, environment pypi.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
