name: release

# Publishes to PyPI automatically when the version in python/idemkit/_version.py
# changes on main. Bump that one line, merge to main, and this builds, publishes
# via PyPI Trusted Publishing (OIDC, no stored token), tags the commit, and cuts
# a GitHub Release. If the version is unchanged (its tag already exists) every
# step is skipped, so an ordinary merge does nothing.
#
# One-time setup before the first run: configure the trusted publisher on PyPI
# (project idemkit, owner idemkit, repository idemkit, workflow release.yml,
# environment pypi) and create a GitHub environment named pypi.

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing (OIDC)
      contents: write # create the tag and the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need existing tags to tell "already released" from "new"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the version
        id: v
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('python/idemkit/_version.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version on main: $version"

      - name: Already released?
        id: check
        run: |
          if git rev-parse "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.v.outputs.version }} already exists, nothing to publish."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.new == 'true'
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.new == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

      - name: Tag and GitHub Release
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.v.outputs.version }}"
          # Pull this version's section out of the changelog for the release notes.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' python/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See python/CHANGELOG.md" > notes.md
          gh release create "v$version" --title "v$version" --notes-file notes.md --target "$GITHUB_SHA"
