name: python

on:
  push:
    paths: ["python/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/ci.yml"]

defaults:
  run:
    working-directory: python

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check idemkit tests examples
      - name: Format check
        run: ruff format --check idemkit tests examples
      - name: Type check
        run: mypy idemkit

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 3s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 3s --health-retries 10
      dynamodb:
        image: amazon/dynamodb-local
        ports: ["8000:8000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          echo "DynamoDB Local did not come up" >&2; exit 1
      - name: Test on real Redis + Postgres + Mongo + DynamoDB
        env:
          IDEMKIT_TEST_REDIS_URL: redis://localhost:6379
          IDEMKIT_TEST_PG_URL: postgresql://postgres:test@localhost:5432/postgres
          IDEMKIT_TEST_MONGO_URL: mongodb://localhost:27017
          IDEMKIT_TEST_DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: pytest
