name: python

on:
  push:
    paths: ["python/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/ci.yml"]

defaults:
  run:
    working-directory: python

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check idemkit tests examples
      - name: Format check
        run: ruff format --check idemkit tests examples
      - name: Type check
        run: mypy idemkit

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Test on real Redis + Postgres
        env:
          IDEMKIT_TEST_REDIS_URL: redis://localhost:6379
          IDEMKIT_TEST_PG_URL: postgresql://postgres:test@localhost:5432/postgres
        run: pytest
