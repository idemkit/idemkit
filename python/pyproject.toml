[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idemkit"
version = "0.1.0"
description = "Make any operation safe to retry: crash-safe idempotency for HTTP requests, queue messages, and function calls, on Redis or Postgres."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Violetta Pidvolotska"}]
keywords = [
    "idempotency", "idempotent", "idempotency-key", "deduplication", "dedup",
    "exactly-once", "effectively-once", "retry", "retry-safe", "crash-recovery",
    "http", "asgi", "fastapi", "starlette", "middleware", "webhook",
    "redis", "postgres", "race-safe", "concurrency",
    "queue", "consumer", "llm", "agent", "tool-calls",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0"]
postgres = ["asyncpg>=0.29"]
asgi = ["starlette>=0.30"]
prometheus = ["prometheus-client>=0.19"]
# Clients for the end-to-end suite (tests/e2e/); not needed to use idemkit.
e2e = ["boto3>=1.34", "kafka-python>=2.0", "pika>=1.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
    "starlette>=0.30",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "redis>=5.0",
    "fakeredis[lua]>=2.20",
    "hypothesis>=6.0",
    "asyncpg>=0.29",
    "prometheus-client>=0.19",
    "django>=4.2",
    "djangorestframework>=3.14",
]

[project.scripts]
idemkit = "idemkit.cli:main"

[project.urls]
Homepage = "https://github.com/idemkit/idemkit"
Specification = "https://github.com/idemkit/idemkit/blob/main/spec/idemkit-unified-spec.md"
Issues = "https://github.com/idemkit/idemkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["idemkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# e2e tests need dockerized services; excluded by default. Run them with `-m e2e`.
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end tests against locally dockerized services (see tests/e2e/)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["idemkit", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", # pycodestyle + pyflakes
    "I",           # isort (import order)
    "B",           # flake8-bugbear (likely bugs)
    "UP",          # pyupgrade (modern syntax)
    "C4",          # flake8-comprehensions
    "SIM",         # flake8-simplify
    "PIE",         # flake8-pie (misc lints)
    "PT",          # flake8-pytest-style
    "RET",         # flake8-return
    "TID",         # flake8-tidy-imports
    "FLY",         # flynt (str.join -> f-string)
    "PERF",        # perflint
    "PLE",         # pylint errors
    "RUF",         # ruff-specific
]
ignore = [
    "SIM105",  # try/except/pass reads clearer than contextlib.suppress in cleanup
    "SIM108",  # an explicit if/else is sometimes clearer than a ternary
    "PT018",   # composite asserts (assert a and b) are fine and read clearly
    "PERF203", # try/except inside a loop is sometimes unavoidable
]

[tool.ruff.lint.flake8-tidy-imports]
# The package is 100% absolute imports; keep it that way (no `from .x import`).
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["idemkit"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "fakeredis", "fakeredis.*", "django", "django.*"]
ignore_missing_imports = true
